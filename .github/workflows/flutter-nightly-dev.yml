name: Flutter Nightly Build Dev

on:
  # schedule:
  #   # schedule build every night
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build-dev.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      do-windows-flutter: false
      do-windows-sciter: false
      do-linux: true
